  <rect width="440" height="220" rx="12" fill="url(#pat-20k)"/>
  <rect width="440" height="220" rx="12" fill="url(#lines-20k)"/>
  <ellipse cx="220" cy="110" rx="220" ry="110" fill="url(#shine-20k)"/>

