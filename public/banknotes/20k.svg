  <rect x="4" y="4" width="432" height="212" rx="9" fill="none" stroke="#0c4a6e" stroke-width="1.5" opacity="0.5"/>
  <rect x="8" y="8" width="424" height="204" rx="7" fill="none" stroke="#0c4a6e" stroke-width="0.6" stroke-dasharray="3,2" opacity="0.4"/>

