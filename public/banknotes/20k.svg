  <!-- big denomination number watermark (subtle) -->
  <text x="220" y="200" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="46" font-weight="900" fill="#0c4a6e" opacity="0.18">20.000</text>

