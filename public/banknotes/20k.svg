  <g transform="translate(392, 60)"><g transform="translate(0,0)">
      <circle r="14" fill="#fbbf24" stroke="#0c4a6e" stroke-width="1.5"/>
      <path d="M 0 -10 L 2.5 -3 L 9 -3 L 4 1.5 L 6 9 L 0 5 L -6 9 L -4 1.5 L -9 -3 L -2.5 -3 Z" fill="#0c4a6e"/>
