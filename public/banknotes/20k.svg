  <text x="220" y="212" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="10" font-weight="800" fill="#0c4a6e" letter-spacing="2" opacity="0.9">HAI MƯƠI NGHÌN ĐỒNG</text>

