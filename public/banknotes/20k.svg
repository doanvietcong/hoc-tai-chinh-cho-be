  <text x="392" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#0c4a6e" letter-spacing="0.5">★</text>
  <text x="392" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#0c4a6e" letter-spacing="0.5">★</text>
  <text x="392" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#0c4a6e" letter-spacing="0.5">★</text>
  <text x="392" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#0c4a6e" letter-spacing="0.5">★</text>

