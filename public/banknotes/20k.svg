    <text y="3" text-anchor="middle" font-family="serif" font-size="9" font-weight="900" fill="#0c4a6e">₫</text>
  </g>

  <!-- fine serial number -->
  <text x="220" y="198" text-anchor="middle" font-family="monospace" font-size="7" font-weight="600" fill="#0c4a6e" opacity="0.55" letter-spacing="2">SB20K-821298</text>
