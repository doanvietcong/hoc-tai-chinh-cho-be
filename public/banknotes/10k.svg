<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220">
  <defs>
    <linearGradient id="bg-10k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <pattern id="pat-10k" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 7 0 L 8 6 L 14 7 L 8 8 L 7 14 L 6 8 L 0 7 L 6 6 Z" fill="#78350f" opacity="0.06"/>
    </pattern>
    <pattern id="lines-10k" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#78350f" stroke-width="0.4" opacity="0.15"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#78350f" stroke-width="0.4" opacity="0.15"/>
    </pattern>
    <radialGradient id="shine-10k" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="440" height="220" rx="12" fill="url(#bg-10k)"/>
  <rect width="440" height="220" rx="12" fill="url(#pat-10k)"/>
  <rect width="440" height="220" rx="12" fill="url(#lines-10k)"/>
  <ellipse cx="220" cy="110" rx="220" ry="110" fill="url(#shine-10k)"/>

  <!-- outer border (decorative) -->
  <rect x="4" y="4" width="432" height="212" rx="9" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
  <rect x="8" y="8" width="424" height="204" rx="7" fill="none" stroke="#78350f" stroke-width="0.6" stroke-dasharray="3,2" opacity="0.4"/>

  <!-- corner ornaments -->
  <g fill="#b45309" opacity="0.85">
    <path d="M 16 16 L 18 21 L 23 21 L 19 24 L 21 29 L 16 26 L 11 29 L 13 24 L 9 21 L 14 21 Z"/>
    <path d="M 424 16 L 426 21 L 431 21 L 427 24 L 429 29 L 424 26 L 419 29 L 421 24 L 417 21 L 422 21 Z"/>
    <path d="M 16 204 L 18 199 L 23 199 L 19 196 L 21 191 L 16 194 L 11 191 L 13 196 L 9 199 L 14 199 Z"/>
    <path d="M 424 204 L 426 199 L 431 199 L 427 196 L 429 191 L 424 194 L 419 191 L 421 196 L 417 199 L 422 199 Z"/>
  </g>

  <!-- header -->
  <text x="220" y="26" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="11" font-weight="800" fill="#78350f" letter-spacing="1.4">NGÂN HÀNG NHÀ NƯỚC VIỆT NAM</text>

  <!-- 国徽 style star (left) -->
  <g transform="translate(48, 60)"><g transform="translate(0,0)">
      <circle r="14" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
      <path d="M 0 -10 L 2.5 -3 L 9 -3 L 4 1.5 L 6 9 L 0 5 L -6 9 L -4 1.5 L -9 -3 L -2.5 -3 Z" fill="#78350f"/>
    </g></g>
  <text x="48" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>
  <text x="48" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>
  <text x="48" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>
  <text x="48" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>

  <!-- 国徽 style star (right) -->
  <g transform="translate(392, 60)"><g transform="translate(0,0)">
      <circle r="14" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
      <path d="M 0 -10 L 2.5 -3 L 9 -3 L 4 1.5 L 6 9 L 0 5 L -6 9 L -4 1.5 L -9 -3 L -2.5 -3 Z" fill="#78350f"/>
    </g></g>
  <text x="392" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>
  <text x="392" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>
  <text x="392" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>
  <text x="392" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#78350f" letter-spacing="0.5">★</text>

  <!-- central iconic illustration -->
  <g>
    <g transform="translate(220, 130)">
      <!-- river -->
      <path d="M -70 30 Q -35 26, 0 30 T 70 30 L 70 50 L -70 50 Z" fill="#0284c7" opacity="0.4"/>
      <!-- bridge deck -->
      <rect x="-65" y="18" width="130" height="4" fill="#7c2d12"/>
      <!-- arches -->
      <path d="M -60 22 Q -50 36, -40 22" fill="none" stroke="#7c2d12" stroke-width="2"/>
      <path d="M -40 22 Q -30 36, -20 22" fill="none" stroke="#7c2d12" stroke-width="2"/>
      <path d="M -20 22 Q -10 36, 0 22" fill="none" stroke="#7c2d12" stroke-width="2"/>
      <path d="M 0 22 Q 10 36, 20 22" fill="none" stroke="#7c2d12" stroke-width="2"/>
      <path d="M 20 22 Q 30 36, 40 22" fill="none" stroke="#7c2d12" stroke-width="2"/>
      <path d="M 40 22 Q 50 36, 60 22" fill="none" stroke="#7c2d12" stroke-width="2"/>
      <!-- trusses -->
      <line x1="-65" y1="18" x2="-60" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="-50" y1="18" x2="-50" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="-40" y1="18" x2="-40" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="-30" y1="18" x2="-30" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="-20" y1="18" x2="-20" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="-10" y1="18" x2="-10" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="0" y1="18" x2="0" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="10" y1="18" x2="10" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="20" y1="18" x2="20" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="30" y1="18" x2="30" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="40" y1="18" x2="40" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="50" y1="18" x2="50" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <line x1="60" y1="18" x2="60" y2="2" stroke="#7c2d12" stroke-width="1"/>
      <!-- top chord -->
      <line x1="-65" y1="2" x2="65" y2="2" stroke="#7c2d12" stroke-width="1.5"/>
    </g>
  </g>

  <!-- big denomination number watermark (subtle) -->
  <text x="220" y="200" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="46" font-weight="900" fill="#78350f" opacity="0.18">10.000</text>

  <!-- bottom text -->
  <text x="220" y="212" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="10" font-weight="800" fill="#78350f" letter-spacing="2" opacity="0.9">MƯỜI NGHÌN ĐỒNG</text>

  <!-- side number copies (small, near star) -->
  <text x="76" y="64" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="14" font-weight="800" fill="#78350f">10.000</text>
  <text x="364" y="64" text-anchor="end" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="14" font-weight="800" fill="#78350f">10.000</text>

  <!-- coin glyph next to numbers -->
  <g transform="translate(76, 80)">
    <circle r="7" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <text y="3" text-anchor="middle" font-family="serif" font-size="9" font-weight="900" fill="#78350f">₫</text>
  </g>
  <g transform="translate(364, 80)">
    <circle r="7" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <text y="3" text-anchor="middle" font-family="serif" font-size="9" font-weight="900" fill="#78350f">₫</text>
  </g>

  <!-- fine serial number -->
  <text x="220" y="198" text-anchor="middle" font-family="monospace" font-size="7" font-weight="600" fill="#78350f" opacity="0.55" letter-spacing="2">SB10K-218382</text>
</svg>
