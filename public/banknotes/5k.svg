<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220">
  <defs>
    <linearGradient id="bg-5k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <pattern id="pat-5k" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 7 0 L 8 6 L 14 7 L 8 8 L 7 14 L 6 8 L 0 7 L 6 6 Z" fill="#881337" opacity="0.06"/>
    </pattern>
    <pattern id="lines-5k" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#881337" stroke-width="0.4" opacity="0.15"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#881337" stroke-width="0.4" opacity="0.15"/>
    </pattern>
    <radialGradient id="shine-5k" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="440" height="220" rx="12" fill="url(#bg-5k)"/>
  <rect width="440" height="220" rx="12" fill="url(#pat-5k)"/>
  <rect width="440" height="220" rx="12" fill="url(#lines-5k)"/>
  <ellipse cx="220" cy="110" rx="220" ry="110" fill="url(#shine-5k)"/>

  <!-- outer border (decorative) -->
  <rect x="4" y="4" width="432" height="212" rx="9" fill="none" stroke="#881337" stroke-width="1.5" opacity="0.5"/>
  <rect x="8" y="8" width="424" height="204" rx="7" fill="none" stroke="#881337" stroke-width="0.6" stroke-dasharray="3,2" opacity="0.4"/>

  <!-- corner ornaments -->
  <g fill="#be123c" opacity="0.85">
    <path d="M 16 16 L 18 21 L 23 21 L 19 24 L 21 29 L 16 26 L 11 29 L 13 24 L 9 21 L 14 21 Z"/>
    <path d="M 424 16 L 426 21 L 431 21 L 427 24 L 429 29 L 424 26 L 419 29 L 421 24 L 417 21 L 422 21 Z"/>
    <path d="M 16 204 L 18 199 L 23 199 L 19 196 L 21 191 L 16 194 L 11 191 L 13 196 L 9 199 L 14 199 Z"/>
    <path d="M 424 204 L 426 199 L 431 199 L 427 196 L 429 191 L 424 194 L 419 191 L 421 196 L 417 199 L 422 199 Z"/>
  </g>

  <!-- header -->
  <text x="220" y="26" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="11" font-weight="800" fill="#881337" letter-spacing="1.4">NGÂN HÀNG NHÀ NƯỚC VIỆT NAM</text>

  <!-- 国徽 style star (left) -->
  <g transform="translate(48, 60)"><g transform="translate(0,0)">
      <circle r="14" fill="#fbbf24" stroke="#881337" stroke-width="1.5"/>
      <path d="M 0 -10 L 2.5 -3 L 9 -3 L 4 1.5 L 6 9 L 0 5 L -6 9 L -4 1.5 L -9 -3 L -2.5 -3 Z" fill="#881337"/>
    </g></g>
  <text x="48" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>
  <text x="48" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>
  <text x="48" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>
  <text x="48" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>

  <!-- 国徽 style star (right) -->
  <g transform="translate(392, 60)"><g transform="translate(0,0)">
      <circle r="14" fill="#fbbf24" stroke="#881337" stroke-width="1.5"/>
      <path d="M 0 -10 L 2.5 -3 L 9 -3 L 4 1.5 L 6 9 L 0 5 L -6 9 L -4 1.5 L -9 -3 L -2.5 -3 Z" fill="#881337"/>
    </g></g>
  <text x="392" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>
  <text x="392" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>
  <text x="392" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>
  <text x="392" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#881337" letter-spacing="0.5">★</text>

  <!-- central iconic illustration -->
  <g>
    <g transform="translate(220, 130)">
      <!-- water -->
      <path d="M -60 18 Q -30 12, 0 18 T 60 18 L 60 32 L -60 32 Z" fill="#0ea5e9" opacity="0.5"/>
      <path d="M -50 24 Q -20 20, 10 24 T 60 24" stroke="#fff" stroke-width="1" fill="none" opacity="0.5"/>
      <!-- big karst -->
      <path d="M -40 18 Q -36 -28, -22 -32 Q -10 -34, -8 0 Q -6 12, -2 18 Z" fill="#15803d" stroke="#14532d" stroke-width="1"/>
      <path d="M -28 -10 Q -22 -16, -18 -10" fill="none" stroke="#bbf7d0" stroke-width="1"/>
      <!-- middle karst -->
      <path d="M 0 18 Q -2 -22, 8 -28 Q 18 -30, 22 0 Q 24 10, 26 18 Z" fill="#16a34a" stroke="#14532d" stroke-width="1"/>
      <path d="M 8 -12 Q 12 -18, 16 -12" fill="none" stroke="#bbf7d0" stroke-width="1"/>
      <!-- right karst -->
      <path d="M 28 18 Q 30 -18, 40 -22 Q 50 -24, 54 4 Q 56 12, 58 18 Z" fill="#15803d" stroke="#14532d" stroke-width="1"/>
      <path d="M 42 -8 Q 46 -12, 50 -8" fill="none" stroke="#bbf7d0" stroke-width="1"/>
      <!-- junk boat -->
      <path d="M -16 22 L 8 22 L 6 26 L -14 26 Z" fill="#7c2d12"/>
      <rect x="-6" y="16" width="3" height="6" fill="#7c2d12"/>
    </g>
  </g>

  <!-- big denomination number watermark (subtle) -->
  <text x="220" y="200" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="46" font-weight="900" fill="#881337" opacity="0.18">5.000</text>

  <!-- bottom text -->
  <text x="220" y="212" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="10" font-weight="800" fill="#881337" letter-spacing="2" opacity="0.9">NĂM NGHÌN ĐỒNG</text>

  <!-- side number copies (small, near star) -->
  <text x="76" y="64" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="14" font-weight="800" fill="#881337">5.000</text>
  <text x="364" y="64" text-anchor="end" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="14" font-weight="800" fill="#881337">5.000</text>

  <!-- coin glyph next to numbers -->
  <g transform="translate(76, 80)">
    <circle r="7" fill="#fbbf24" stroke="#881337" stroke-width="1"/>
    <text y="3" text-anchor="middle" font-family="serif" font-size="9" font-weight="900" fill="#881337">₫</text>
  </g>
  <g transform="translate(364, 80)">
    <circle r="7" fill="#fbbf24" stroke="#881337" stroke-width="1"/>
    <text y="3" text-anchor="middle" font-family="serif" font-size="9" font-weight="900" fill="#881337">₫</text>
  </g>

  <!-- fine serial number -->
  <text x="220" y="198" text-anchor="middle" font-family="monospace" font-size="7" font-weight="600" fill="#881337" opacity="0.55" letter-spacing="2">SB5K-257306</text>
</svg>
